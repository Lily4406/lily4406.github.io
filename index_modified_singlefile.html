            const ref = useRef(null);

            return (
                <div ref={ref} className={className}>
                    <motion.div
                        initial={{ opacity: 0, y: 20 }}
                        animate={isInView ? { opacity: 1, y: 0 } : { opacity: 0, y: 20 }}
                        transition={{ duration: 0.8, delay: delay, ease: "easeOut" }}
                    >
                        {children}
                    </motion.div>
                </div>
            );
        }


        // FullscreenModal Component
        function FullscreenModal({ isOpen, onClose, children }) {
            useEffect(() => {
                if (isOpen) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'auto';
                }
                return () => {
                    document.body.style.overflow = 'auto';
                };
            }, [isOpen]);

            if (!isOpen) return null;

            return (
                <div className="fullscreen-modal" onClick={onClose}>
                    <div className="fullscreen-modal-content" onClick={(e) => e.stopPropagation()}>
                        <button className="fullscreen-close-btn" onClick={onClose}>×</button>
                        {children}

                </div>
            );

        const __BEAUTIFUL_TABLE_CSS  = ".beautiful-table-scope *{\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }.beautiful-table-scope .container{\n            max-width: 1200px;\n            margin: 0 auto;\n            background: white;\n            border-radius: 12px;\n            box-shadow: 0 10px 40px rgba(40, 54, 24, 0.15);\n            overflow: hidden;\n        }.beautiful-table-scope .header{\n            background: linear-gradient(135deg, #283618 0%, #606C38 100%);\n            color: #FEFAE0;\n            padding: 40px;\n            text-align: center;\n        }.beautiful-table-scope .header h1{\n            font-size: 32px;\n            margin-bottom: 10px;\n            font-weight: 700;\n            letter-spacing: 0.5px;\n        }.beautiful-table-scope .header p{\n            font-size: 14px;\n            opacity: 0.95;\n            font-weight: 400;\n        }.beautiful-table-scope .table-wrapper{\n            overflow-x: auto;\n            padding: 30px;\n        }.beautiful-table-scope table{\n            width: 100%;\n            border-collapse: collapse;\n        }.beautiful-table-scope thead{\n            background: #F5F3ED;\n        }.beautiful-table-scope th{\n            padding: 16px;\n            text-align: left;\n            font-weight: 600;\n            color: #283618;\n            border-bottom: 3px solid #606C38;\n            font-size: 14px;\n            text-transform: uppercase;\n            letter-spacing: 0.5px;\n        }.beautiful-table-scope td{\n            padding: 16px;\n            border-bottom: 1px solid #E8E5DB;\n            color: #3D4C2F;\n            font-size: 13px;\n            line-height: 1.6;\n        }.beautiful-table-scope tbody tr{\n            transition: all 0.3s ease;\n        }.beautiful-table-scope tbody tr:hover{\n            background-color: #FEFAE0;\n            transform: scale(1.01);\n            box-shadow: 0 2px 8px rgba(96, 108, 56, 0.1);\         function loadScriptOnce(src) {
            return new Promise((resolve, reject) => {
                const existing = document.querySelector(`script[src="${src}"]`);
                if (existing) {
                    if (existing.dataset.loaded === "true") return resolve();
                    existing.addEventListener("load", () => resolve());
                    existing.addEventListener("error", (e) => reject(e));
                    return;
                }
                const s = document.createElement("script");
                s.src = src;
                s.async = true;
                s.dataset.loaded = "false";
                s.onload = () => {
                    s.dataset.loaded = "true";
                    resolve();
                };
                s.onerror = (e) => reject(e);
                document.head.appendChild(s);
            });
        }

                                itemStyle: { color: colors.total.light, borderColor: colors.total.line, borderWidth: 2, opacity: 0, shadowBlur: 6, shadowColor: "rgba(43, 109, 95, 0.3)" },
                                emphasis: { itemStyle: { opacity: 1, shadowBlur: 10, shadowColor: "rgba(43, 109, 95, 0.4)" }, lineStyle: { width: 3.5, shadowBlur: 6 } },
                                symbolSize: 7,
                                showSymbol: false,
                                hoverShowSymbol: true,
                                animationDuration: 2000,
                                animationEasing: "cubicInOut",
                                animationDelay: 200
                            }
                        ]
                    };

                    myChart.setOption(option);

                    const showSymbolsTimer = window.setTimeout(() => {
                        if (destroyed) return;
                        myChart.setOption({
                            series: [
                                { showSymbol: true, itemStyle: { opacity: 1 } },
                                { showSymbol: true, itemStyle: { opacity: 1 } },
                                { showSymbol: true, itemStyle: { opacity: 1 } }

                            seriesVisibility[seriesName] = !seriesVisibility[seriesName];
                            this.classList.toggle("inactive");
                            myChart.dispatchAction({
                                type: seriesVisibility[seriesName] ? "showSeries" : "hideSeries",
                                seriesIndex: seriesIndexMap[seriesName]
                            });
                        });
                    });

                    myChart.on("mousemove", function(params) {
                        if (!tooltip) return;
                        if (params.componentSubType === "line" && params.data !== undefined) {
                            const d = rawData[params.dataIndex];
                            tooltip.innerHTML = `

        // GaugeChart Component
        function GaugeChart({ title, subTitle, chineseMediaCount, foreignMediaCount }) {
            // 计算失衡比
            const imbalanceRatio = useMemo(() => {
                if (chineseMediaCount === 0) return 1;
                return (foreignMediaCount - chineseMediaCount) / chineseMediaCount;
            }, [chineseMediaCount, foreignMediaCount]);

            const formattedRatio = (imbalanceRatio * 100).toFixed(1) + "%";

            // 计算指针角度 (-90deg 到 90deg)
            const rotation = useMemo(() => {
                let ratio = imbalanceRatio;
                if (ratio < -1) ratio = -1;
                if (ratio > 1) ratio = 1;
                return ratio * 90;
            }, [imbalanceRatio]);

            const isExtreme = imbalanceRatio <= -0.99 || imbalanceRatio >= 0.99;

            // 颜色配置
            let colorClass = "text-earth-yellow";
            let strokeColor = "#dda15e";

            if (imbalanceRatio < -0.05) {
                colorClass = "text-bronze";
                strokeColor = "#bc6c25";
            } else if (imbalanceRatio > 0.05) {
                colorClass = "text-earth-green";
                strokeColor = "#606c38";
            }

            return (
                <div className="flex flex-col items-center p-6 rounded-xl shadow-sm bg-white/80 backdrop-blur-sm border border-earth-yellow/30">
                    <h3 className="text-xl font-bold text-dark-green mb-1">{title}</h3>
                    {subTitle && <p className="text-sm text-earth-green/80 mb-6 text-center h-10">{subTitle}</p>}

                    {/* 仪表盘区域 */}
                    <div className="relative w-64 h-32 mb-8 overflow-hidden">
                        {/* 背景半圆 */}
                        <div className="absolute bottom-0 left-0 w-full h-full bg-cream rounded-t-full border-t border-l border-r border-earth-yellow/50"></div>
                        
                        {/* 刻度线 */}
                        <div className="absolute bottom-0 left-1/2 w-full h-full -translate-x-1/2 origin-bottom">
                            {/* 0点 */}
                            <div className="absolute bottom-0 left-1/2 w-0.5 h-4 bg-earth-yellow -translate-x-1/2"></div>
                            {/* -50% */}
                            <div className="absolute bottom-0 left-1/2 w-0.5 h-3 bg-earth-yellow/50 -translate-x-1/2 origin-bottom -rotate-45 transform translate-y-[-50%]"></div>
                            {/* +50% */}
                            <div className="absolute bottom-0 left-1/2 w-0.5 h-3 bg-earth-yellow/50 -translate-x-1/2 origin-bottom rotate-45"></div>
                        </div>

                        {/* 标签 */}
                        <div className="absolute bottom-2 left-4 text-xs font-mono text-earth-green">-100%</div>
                        <div className="absolute bottom-2 right-4 text-xs font-mono text-earth-green">+100%</div>
                        <div className="absolute top-4 left-1/2 -translate-x-1/2 text-xs font-mono text-earth-green">0%</div>

                        {/* 指针 */}
                        <motion.div
                            className="absolute bottom-0 left-1/2 w-1 h-full origin-bottom"
                            initial={{ rotate: 0 }}
                            whileInView={{ 
                                rotate: rotation,
                                scale: isExtreme ? [1, 1.05, 1] : 1,
                            }}
                            transition={{
                                rotate: { duration: 1, ease: "easeOut" },
                                scale: isExtreme ? { repeat: Infinity, duration: 2, ease: "easeInOut" } : {}
                            }}
                            style={{ x: "-50%" }}
                        >
                            <div 
                                className="w-full h-[90%] mx-auto rounded-t-full"
                                style={{ backgroundColor: strokeColor }}
                            ></div>
                            
                            {isExtreme && (
                                <motion.div
                                    className="absolute top-0 left-1/2 w-4 h-4 -translate-x-1/2 -translate-y-1/2 rounded-full blur-md"
                                    style={{ backgroundColor: strokeColor }}
                                    animate={{ opacity: [0.4, 0.8, 0.4] }}
                                    transition={{ repeat: Infinity, duration: 1.5 }}
                                />
                            )}
                        </motion.div>

                        {/* 中心圆点 */}
                        <div className="absolute bottom-0 left-1/2 w-4 h-4 bg-cream border-2 border-earth-yellow rounded-full -translate-x-1/2 translate-y-1/2 z-10"></div>
                    </div>

                    {/* 数据显示 */}
                    <div className="text-center space-y-2 w-full">
                        <div className="flex items-baseline justify-center gap-2">
                            <span className="text-sm text-earth-green">失衡比</span>
                            <span className={`text-3xl font-mono font-bold ${colorClass}`}>
                                {imbalanceRatio > 0 ? "+" : ""}{formattedRatio}
                            </span>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-8 mt-4 text-sm px-4">
                            <div className="text-right border-r border-earth-yellow/30 pr-4">
                                <div className="text-earth-green/70 text-xs mb-1">中媒报道</div>
                                <div className="font-semibold text-dark-green">{chineseMediaCount}</div>
                            </div>
                            <div className="text-left pl-4">
                                <div className="text-earth-green/70 text-xs mb-1">外媒报道</div>
                                <div className="font-semibold text-dark-green">{foreignMediaCount}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

                                </li>

                                </li>

                                </li>
